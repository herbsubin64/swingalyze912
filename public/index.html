<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Swingalyze — Coaching (Checkpoint 2025-09-17)</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>Swingalyze — API-first Coaching</h1>
    <div id="statusDot" class="dot offline" title="API status"></div>
  </header>

  <main class="container">
    <section class="card">
      <h2>1) Load a video</h2>
      <div class="upload-row">
        <input type="file" id="fileInput" accept="video/*" />
        <button id="analyzeBtn" disabled>Analyze</button>
      </div>
      <video id="video" playsinline controls></video>
    </section>

    <section class="card">
      <h2>2) Results</h2>
      <div id="results" class="results"></div>
    </section>

    <section class="card actions">
      <button id="exportBtn" disabled>Export PNG Report</button>
      <a id="downloadLink" class="hidden" download="Swingalyze-Report.png">Download report</a>
    </section>
  </main>

  <footer class="foot">
    <small>Checkpoint: Sept 17, 2025 · Branch: feat/recover · Focus: API-first coaching → PNG report</small>
  </footer>

  <script src="./app.js"></script>
</body>
</html>
