<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Swingalyze — Coaching (Checkpoint 2025-09-17)</title>
  <link rel="stylesheet" href="./styles.css?v=20250917-02" />
</head>
<body>
  <header class="topbar">
    <h1>Swingalyze — API-first Coaching</h1>
    <div class="grow"></div>
    <label class="select-wrap" title="Club preset for coaching targets">
      <span>Club</span>
      <select id="clubSelect">
        <option value="driver">Driver</option>
        <option value="7i" selected>7-Iron</option>
        <option value="wedge">Wedge</option>
      </select>
    </label>
    <div id="statusDot" class="dot offline" title="API status"></div>
  </header>

  <main class="container">
    <section class="card">
      <h2>1) Load a video</h2>
      <div class="upload-row">
        <input type="file" id="fileInput" accept="video/*" />
        <button id="analyzeBtn" disabled>Analyze</button>
      </div>
      <video id="video" playsinline controls></video>
    </section>

    <section class="card">
      <h2>2) Results</h2>
      <div id="results" class="results"></div>
    </section>

    <section class="card actions">
      <button id="exportPngBtn" disabled>Export PNG Report</button>
      <button id="exportJsonBtn" disabled>Export Analysis JSON</button>
      <a id="downloadLink" class="hidden" download>Download</a>
    </section>
  </main>

  <footer class="foot">
    <small>Checkpoint: Sept 17, 2025 · Branch: feat/recover · Coaching: per-club tunable targets</small>
  </footer>

  <script src="./app.js?v=20250917-02"></script>
</body>
</html>
