<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Swingalyze — Coaching (Checkpoint 2025-09-17)</title>
  <link rel="stylesheet" href="./styles.css?v=20250917-07" />
</head>
<body>
  <header class="topbar">
    <h1>Swingalyze — API-first Coaching</h1>
    <div class="spacer"></div>
    <label class="opt" title="Analyzer base URL (saved in your browser)">
      API:
      <input id="apiBaseInput" type="text" placeholder="(relative) or https://analyzer.example.com" style="min-width:260px" />
    </label>
    <span id="buildTag" class="buildtag" title="Build tag">dev</span>
    <div id="statusDot" class="dot offline" title="API status"></div>
  </header>

  <main class="container">
    <section class="card">
      <h2>1) Load a video</h2>
      <div class="upload-row">
        <input type="file" id="fileInput" accept="video/*" />
        <button id="analyzeBtn" disabled>Analyze</button>
        <span style="opacity:.7">or</span>
        <input type="file" id="jsonInput" accept="application/json" title="Load analysis JSON" />
      </div>
      <video id="video" playsinline controls></video>
    </section>

    <section class="card">
      <h2>2) Results</h2>
      <div id="results" class="results"></div>
    </section>

    <section class="card actions">
      <label class="opt"><input type="checkbox" id="optFrameStrip" checked /> Frame strip (address • top • impact)</label>
      <label class="opt"><input type="checkbox" id="optHiRes" /> Hi-Res PNG (2×)</label>
    </section>

    <section class="card actions">
      <button id="exportPngBtn" disabled>Export PNG Report</button>
      <button id="sharePngBtn" disabled>Share PNG</button>
      <button id="exportCsvBtn" disabled>Export CSV</button>
      <button id="exportJsonBtn" disabled>Export Analysis JSON</button>
      <a id="downloadLink" class="hidden" download>Download</a>
    </section>
  </main>

  <footer class="foot">
    <small>Checkpoint: Sept 17, 2025 · Branch: feat/recover · Coaching: badges + overlays • PNG: frame strip + 2× option • Mobile: responsive + Share</small>
  </footer>

  <script>
    // Fallback build tag; app.js will load public/build.json and overwrite.
    window.__BUILD__ = window.__BUILD__ || 'dev';
  </script>
  <script src="./app.js?v=20250917-07"></script>
</body>
</html>
