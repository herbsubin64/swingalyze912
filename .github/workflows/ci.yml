name: CI
on:
  pull_request:
  push:
    branches: [ main ]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.x' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: npm ci || npm i
      - run: python3 -m pip install --upgrade pip
      - run: python3 -m pip install opencv-python-headless numpy
      - run: nohup npm start >/dev/null 2>&1 & echo $! > server.pid
      - run: sleep 3
      - name: Status
        run: curl -sS http://localhost:3000/api/status | jq -e '.ok == true'
      - name: Golden (angles, toleranced)
        run: python3 scripts/verify_golden.py
      - name: Stop server
        if: always()
        run: kill $(cat server.pid) || true
