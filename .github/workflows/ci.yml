name: swingalyze-ci
on:
  push:
    branches: [ feat/recover ]
  pull_request:
    branches: [ feat/recover ]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Build tag for PNG footer
      - name: Write build tag
        run: |
          mkdir -p public
          echo "{\"sha\":\"$(git rev-parse HEAD)\"}" > public/build.json
          cat public/build.json

      - name: Verify build tag file
        run: node scripts/verify-buildtag.mjs

      - name: Contract check (ALL goldens)
        run: |
          set -e
          for f in fixtures/*.golden.json; do
            echo "Checking $f"
            node scripts/verify-analyze-shape.mjs "$f"
          done

      - name: Validate metric bounds (ALL goldens)
        run: node scripts/validate-metrics-bounds.mjs

      - name: Validate ranges vs bounds/tolerances
        run: node scripts/validate-ranges-vs-bounds.mjs

      - name: Validate ranges profiles
        run: node scripts/validate-ranges.mjs

      - name: Coaching normalization test
        run: node scripts/test-coaching-normalization.mjs

      - name: Static smoke (UI controls present)
        run: node scripts/smoke-static.mjs

      - name: Optional live compare-to-golden (skips if no env)
        env:
          ANALYZE_URL: ${{ secrets.ANALYZE_URL }}
          ANALYZE_VIDEO: ${{ secrets.ANALYZE_VIDEO }}
        run: node scripts/compare-to-golden.mjs

      - name: Optional light load test (skips if no env)
        env:
          ANALYZE_URL: ${{ secrets.ANALYZE_URL }}
          ANALYZE_VIDEO: ${{ secrets.ANALYZE_VIDEO }}
        run: node scripts/load-test.mjs 5 1
